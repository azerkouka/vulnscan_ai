server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Security headers for the single-page app. "always": also on error pages.
    #
    # The content policy allows only what the bundle needs: its own scripts,
    # API calls to its own origin, and no framing by anyone. Styles need
    # 'unsafe-inline' because Angular injects component styles as <style>
    # elements at runtime; scripts do not get it, which is what matters
    # against XSS. This is also why the production build turns off critical
    # CSS inlining (angular.json): it loads the stylesheet through an inline
    # onload handler, which this policy rightly blocks.
    #
    # nginx drops inherited add_header directives in any location that has
    # its own, hence the include-style repetition below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The production bundle calls the API on its own origin (/api/v1, see
    # src/environments/environment.production.ts); forward those calls to the
    # backend service. Uploads are capped by the backend (UPLOAD_MAX_SIZE_MB),
    # so the proxy limit only needs to sit above that.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 120s;

        # API responses carry the backend's own security headers (a stricter,
        # JSON-only policy). Declaring a header here stops this location from
        # also inheriting the page-oriented ones above, which would otherwise
        # be sent twice; the backend's copy of this one is hidden so that it,
        # too, appears exactly once.
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Angular client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html is always revalidated.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
