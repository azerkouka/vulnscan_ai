<main class="auth-page">
  <section class="card auth-card" aria-labelledby="login-title">
    <app-brand />
    <div>
      <h1 id="login-title">Sign in</h1>
      <p class="muted">Review your code for security vulnerabilities.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (errorMessage(); as message) {
        <p class="alert alert-error" role="alert">{{ message }}</p>
      }

      <div class="field">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="showError('email')"
          [attr.aria-describedby]="showError('email') ? 'login-email-error' : null"
        />
        @if (showError('email')) {
          <p class="field-error" id="login-email-error">Enter a valid email address.</p>
        }
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="showError('password')"
          [attr.aria-describedby]="showError('password') ? 'login-password-error' : null"
        />
        @if (showError('password')) {
          <p class="field-error" id="login-password-error">Enter your password.</p>
        }
      </div>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-switch">
      No account yet?
      <a routerLink="/register" queryParamsHandling="preserve">Create one</a>
    </p>
  </section>
</main>
