[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnscan-ai-backend"
version = "0.1.0"
description = "VulnScan AI backend - RAG-grounded LLM source code vulnerability scanner"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.12,<0.1",

    # Validation / settings
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",

    # Persistence
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",

    # Auth / security
    "pyjwt>=2.9,<3",
    "argon2-cffi>=23.1,<24",

    # Logging
    "structlog>=24.4,<25",

    # Rate limiting
    "slowapi>=0.1.9,<0.2",
]

[project.optional-dependencies]
# RAG / LLM pipeline (Phase 3 onward). Split out because chromadb pulls in
# chroma-hnswlib, a native extension with prebuilt wheels for Linux/macOS but
# not for every Windows + Python combination - installing this group on
# Windows requires the "Microsoft C++ Build Tools". The Docker image always
# installs it (Linux wheels), so this only matters for local, non-Docker dev.
rag = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=0.2,<0.3",
    "chromadb>=0.5.20,<0.6",
]
# Code chunking (Phase 4 onward). Same native-extension caveat as `rag`
# (tree-sitter-language-pack compiles per-language parsers).
chunking = [
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-language-pack>=0.2,<0.3",
]
# Report export (Phase 7 onward). WeasyPrint is pure Python but needs the
# Pango system library at runtime: present in the Docker image, a separate
# install on Windows/macOS. Without it PDF export answers 503 and JSON
# export keeps working.
export = [
    "weasyprint>=62,<63",
    # WeasyPrint 62 draws through pydyf's `Stream.transform`, which pydyf 0.11
    # removed - with it, every PDF export fails. Drop this pin when moving to
    # a WeasyPrint release that supports the newer pydyf.
    "pydyf>=0.10,<0.11",
    "jinja2>=3.1,<4",
]
dev = [
    "ruff>=0.7,<0.8",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "pytest-mock>=3.14,<4",
    "httpx>=0.27,<0.28",
    "aiosqlite>=0.20,<0.21",
    "types-python-jose",
    "pre-commit>=4.0,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff (linting only - black owns formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]
# data/samples holds deliberately vulnerable code for the scanner to find -
# it is input data, not part of the codebase, and must stay as it is.
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "SIM",              # flake8-simplify
    "C4",               # flake8-comprehensions
    "N",                # pep8-naming
    "S",                # flake8-bandit (basic security lint)
    "RUF",              # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by black
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]  # asserts and dummy secrets are fine in tests
"tests/conftest.py" = ["E402"]              # env vars must be set before importing the app

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI idiom is `param: T = Depends(...)` - these calls are
# side-effect-free markers evaluated once per request by FastAPI itself, not
# the mutable-default-argument footgun B008 warns about.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/data/"

# ---------------------------------------------------------------------------
# Mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "langchain.*", "langchain_community.*", "langchain_ollama.*", "tree_sitter_language_pack.*", "weasyprint.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests with mocked ports",
    "integration: tests hitting a real test database",
    "e2e: full API tests via the ASGI test client",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
