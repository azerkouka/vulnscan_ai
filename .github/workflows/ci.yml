name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend-lint:
    name: Backend / lint (ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend + dev dependencies
        working-directory: backend
        # Extend to ".[dev,rag]" from Phase 3 and ".[dev,rag,chunking,export]"
        # from Phase 4/7 onward, as those optional groups start being used.
        run: pip install -e ".[dev]"
      - name: ruff
        working-directory: backend
        run: ruff check .
      - name: black --check
        working-directory: backend
        run: black --check .
      - name: mypy --strict
        working-directory: backend
        run: mypy app

  backend-test:
    name: Backend / tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnscan
          POSTGRES_PASSWORD: vulnscan
          POSTGRES_DB: vulnscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vulnscan -d vulnscan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://vulnscan:vulnscan@localhost:5432/vulnscan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend + dev dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: pytest
        working-directory: backend
        # Coverage enforcement (>=80% on domain/application) is switched on
        # from Phase 2 onward, once those layers contain real code.
        run: pytest

  frontend-lint:
    name: Frontend / lint (eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: prettier --check
        working-directory: frontend
        run: npm run format:check

  frontend-test:
    name: Frontend / unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests (headless Chrome)
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker / build images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image (dev target)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
