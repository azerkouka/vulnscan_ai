name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend-lint:
    name: Backend / lint (ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend + dev dependencies
        working-directory: backend
        run: pip install -e ".[dev,rag,chunking,export]"
      - name: ruff
        working-directory: backend
        run: ruff check .
      - name: black --check
        working-directory: backend
        run: black --check .
      - name: mypy --strict
        working-directory: backend
        run: mypy app

  backend-test:
    name: Backend / tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnscan
          POSTGRES_PASSWORD: vulnscan
          POSTGRES_DB: vulnscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vulnscan -d vulnscan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chromadb:
        image: chromadb/chroma:0.5.20
        ports: ["8000:8000"]
    env:
      JWT_SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://vulnscan:vulnscan@localhost:5432/vulnscan_test
      CHROMA_HOST: localhost
      CHROMA_PORT: 8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Pango (needed by WeasyPrint for the PDF export tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - name: Install backend + dev dependencies
        working-directory: backend
        run: pip install -e ".[dev,rag,chunking,export]"
      - name: Wait for ChromaDB
        # No --health-cmd on the service above: it'd run via `docker exec`
        # inside the chromadb image, which may not have curl. Polling from
        # the runner against the published port needs no such assumption.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/heartbeat > /dev/null; then
              echo "ChromaDB is up"; exit 0
            fi
            sleep 2
          done
          echo "ChromaDB did not become ready in time" >&2
          exit 1
      - name: pytest
        working-directory: backend
        # Coverage enforcement (>=80% on domain/application) is switched on
        # from Phase 2 onward, once those layers contain real code.
        run: pytest

  frontend-lint:
    name: Frontend / lint (eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: prettier --check
        working-directory: frontend
        run: npm run format:check

  frontend-test:
    name: Frontend / unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        # Vitest in jsdom (the Angular unit-test builder's default) - no
        # browser to install on the runner.
        run: npm test -- --watch=false
      - name: Production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker / build images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image (dev target)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
