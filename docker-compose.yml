name: vulnscan-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port is configurable: 5432 is often already taken by a
      # PostgreSQL installed on the host itself.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vulnscan-net]

  chromadb:
    image: chromadb/chroma:0.5.20
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vulnscan-net]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    # Uncomment to pass through an NVIDIA GPU (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks: [vulnscan-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Built from the same POSTGRES_* values the postgres service is created
      # with, so the two can't drift apart. The DATABASE_URL line of .env is
      # only for running the backend outside Docker.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
    networks: [vulnscan-net]

  # The complete backend test suite, on Linux - where every optional
  # dependency installs, unlike on Windows (see README, "Backend checks").
  # Not started by `docker compose up`; run it on demand with:
  #   docker compose run --rm backend-tests
  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: Dockerfile
    # root: installs the dev dependencies into the image's venv at start-up.
    user: root
    working_dir: /app
    environment:
      # Always the *_test database: the suite creates and drops every table,
      # so it must never be pointed at the development database.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      JWT_SECRET_KEY: test-secret-key-not-for-production-use-only
      ENVIRONMENT: test
      AUTH_RATE_LIMIT: 1000/minute
    volumes:
      # The working tree, not the copy baked into the image (which leaves
      # tests/ out), so the run always reflects the current code.
      - ./backend:/app
      # Chroma downloads its embedding model (~80 MB) on first use; kept in a
      # volume so each run does not fetch it again.
      - backend_tests_model_cache:/root/.cache/chroma
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: sh -c "pip install -q -e '.[dev]' && python -m pytest -p no:cacheprovider"
    networks: [vulnscan-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [vulnscan-net]

networks:
  vulnscan-net:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
  backend_uploads:
  backend_tests_model_cache:
  frontend_node_modules:
